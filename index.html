:root {
  --font-display: "Bitter", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --bg: #EEF3F5;

  --muted: #43606E;
  --line: #C3D2DA;
  --accent: #0B6B73;
  --accent-fg: #FFFFFF;
  --accent-soft: #D6EBED;
  --go: #1B7A33;
  --go-fg: #FFFFFF;
  --wait: #46535B;
  --wait-fg: #FFFFFF;
  --warn: #8A4B00;
  --warn-soft: #FBEBD3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1A20; --surface: #16262E; --fg: #EAF2F5; --muted: #A9C1CC; --line: #2F4650;
    --accent: #5CC6CE; --accent-fg: #06262A; --accent-soft: #153A40;
    --go: #4CC46A; --go-fg: #06210E; --wait: #5B6B74; --wait-fg: #FFFFFF;
    --warn: #F2B35E; --warn-soft: #3A2A10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1A20; --surface: #16262E; --fg: #EAF2F5; --muted: #A9C1CC; --line: #2F4650;
  --accent: #5CC6CE; --accent-fg: #06262A; --accent-soft: #153A40;
  --go: #4CC46A; --go-fg: #06210E; --wait: #5B6B74; --wait-fg: #FFFFFF;
  --warn: #F2B35E; --warn-soft: #3A2A10;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html.large { font-size: 118%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 1.25rem;
  line-height: 1.55;
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.app {
  max-width: 46rem;
  margin: 0 auto;
  padding-top: 1rem;
  padding-bottom: 3rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app > * + * { margin-top: 1rem; }
.top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; margin-right: .75rem; }
.tools { display: flex; flex-wrap: wrap; }
.chip {
  font: inherit; font-size: 1rem; min-height: 2.75rem; padding: .35rem 1rem; margin: .2rem .5rem .2rem 0;
  border: 2px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--fg); cursor: pointer;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

.steps > * + * { margin-top: .45rem; }
.bar { display: grid; grid-template-columns: repeat(5, 1fr); grid-gap: 6px; gap: 6px; }
.bar i { height: 8px; border-radius: 4px; background: var(--line); display: block; }
.bar i.on { background: var(--accent); }
.steplabel { margin: 0; color: var(--muted); font-size: 1.05rem; }

.stage {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 1.25rem;
  min-height: 26rem;
  display: flex; flex-direction: column;
  outline: none;
  touch-action: manipulation;
}
.stage > * + * { margin-top: 1.25rem; }
@media (min-width: 600px) { .stage { padding: 2.25rem; } }
.stage h1, .stage h2, .stage h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.2; margin: 0; }
.stage h1 { font-size: 2.1rem; }
.stage h2 { font-size: 1.7rem; }
.stage h3 { font-size: 1.3rem; }
.stage p { margin: 0; max-width: 36rem; }
.stage > p + p, .stage > h2 + p { margin-top: .75rem; }
.muted { color: var(--muted); font-size: 1.05rem; }
.stack > * + * { margin-top: 1rem; }

.field > * + * { margin-top: .4rem; }
.field { max-width: 26rem; }
.field label { font-weight: 700; display: block; }
input[type="number"], input[type="text"], select {
  font: inherit; font-size: 1.25rem; min-height: 3.5rem; padding: .5rem .9rem;
  border: 2px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); width: 100%;
}
.check { display: flex; align-items: flex-start; max-width: 36rem; cursor: pointer; }
.check input { width: 1.9rem; height: 1.9rem; flex: none; margin: .1rem 1rem 0 0; accent-color: var(--accent); }
.error { color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: .6rem .9rem; }
.banner { color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: .7rem .9rem; font-size: 1.05rem; }
.note { background: var(--accent-soft); color: var(--fg); border-radius: 10px; padding: .7rem .9rem; font-size: 1.05rem; }
form > * + * { margin-top: 1.25rem; }

.btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); grid-gap: 1rem; gap: 1rem; align-items: stretch; }
.btns.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 420px) { .btns.two { grid-template-columns: 1fr; } }
.btn {
  font: inherit; font-size: 1.25rem; font-weight: 700; min-height: 4.25rem; padding: .75rem 1.2rem;
  border-radius: 14px; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); cursor: pointer;
  text-align: center; display: flex; align-items: center; justify-content: center;
}
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { min-height: 3rem; font-size: 1.05rem; }
.linkbtn { font: inherit; font-size: 1.05rem; background: none; border: 0; padding: .6rem 0; color: var(--muted); text-decoration: underline; cursor: pointer; min-height: 2.75rem; text-align: left; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* profiles and levels */
.plist > * + * { margin-top: .75rem; }
.pcard {
  font: inherit; width: 100%; text-align: left; cursor: pointer;
  border: 2px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--fg); padding: 1rem 1.1rem; min-height: 4.5rem;
  display: block;
}
.pcard:hover { border-color: var(--accent); }
.pname { display: block; font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; overflow-wrap: anywhere; }
.pmeta { display: block; color: var(--muted); font-size: 1.05rem; }
.lvl { display: flex; align-items: flex-start; border: 2px solid var(--line); border-radius: 14px; padding: 1rem 1.1rem; cursor: pointer; background: var(--bg); }
.lvl + .lvl { margin-top: .75rem; }
.lvl.sel { border-color: var(--accent); background: var(--accent-soft); }
.lvl input { width: 1.9rem; height: 1.9rem; flex: none; margin: .15rem 1rem 0 0; accent-color: var(--accent); }
.lvl b { font-family: var(--font-display); font-size: 1.3rem; display: block; }
.lvl span { display: block; color: var(--muted); font-size: 1.05rem; }
.lvl.sel span { color: var(--fg); }
details > summary { font-weight: 700; min-height: 2.75rem; padding: .45rem 0; cursor: pointer; }
details > .inner { padding-top: .5rem; }
details.opt { border: 2px solid var(--line); border-radius: 14px; padding: .25rem 1rem .75rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); grid-gap: .75rem; gap: .75rem; }
.stat { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: .8rem 1rem; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.6rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 1rem; display: block; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr)); grid-gap: .5rem; gap: .5rem; }
.seg .chip { margin: 0; }
.pill { display: inline-block; font-size: 1rem; font-weight: 700; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: .15rem .75rem; margin: .25rem .4rem 0 0; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

.entry { border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1.1rem; background: var(--bg); }
.entry + .entry { margin-top: .75rem; }
.ename { font-family: var(--font-display); font-size: 1.2rem; overflow-wrap: anywhere; }
.etime { display: block; color: var(--muted); font-size: 1.05rem; }
.eres { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); grid-gap: .5rem 1rem; gap: .5rem 1rem; margin: .75rem 0 0; }
.eres dt, .kv dt { color: var(--muted); font-size: 1rem; }
.eres dd, .kv dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: 1fr 1fr; grid-gap: .4rem 1rem; gap: .4rem 1rem; margin: .5rem 0 0; }
.kv div { min-width: 0; }
.results { margin: 0; max-width: 36rem; }
.results div { display: flex; justify-content: space-between; padding: .55rem 0; border-bottom: 1px solid var(--line); }
.results dt { color: var(--muted); margin-right: 1rem; }
.results dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.chart { margin: 0; border: 1px solid var(--line); border-radius: 14px; padding: .9rem; background: var(--bg); }
.chart + .chart { margin-top: 1rem; }
.chart figcaption { margin-bottom: .4rem; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 15px; font-family: var(--font-body); }
.chart .band { fill: var(--accent-soft); }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { fill: var(--surface); stroke: var(--accent); stroke-width: 3; }
.chart .pt.last { fill: var(--accent); }
.chart .val { fill: var(--fg); font-size: 16px; font-weight: 700; font-family: var(--font-body); }
textarea {
  width: 100%; min-height: 8rem; font-family: ui-monospace, Consolas, monospace; font-size: .95rem;
  border: 2px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); padding: .6rem;
}

/* the game screens */
.arena {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 19rem; text-align: center;
  user-select: none; -webkit-user-select: none;
}
.arena > * + * { margin-top: 1.25rem; }
.target {
  width: min(70vw, 18rem); height: min(70vw, 18rem); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; text-align: center;
  font-family: var(--font-display); font-weight: 700; font-size: 2.2rem;
  border: 6px solid transparent;
}
.target[data-state="wait"] { background: var(--wait); color: var(--wait-fg); }
.target[data-state="go"] { background: var(--go); color: var(--go-fg); border-color: var(--fg); }
.target[data-state="early"] { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.target[data-state="done"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.zones { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 1rem; gap: 1rem; width: 100%; }
.zone {
  min-height: 15rem; border-radius: 18px; border: 3px solid var(--line); background: var(--bg); color: var(--fg);
  font: inherit; font-size: 1.25rem; font-weight: 700; display: flex; flex-direction: column;
  align-items: center; padding: 1rem; cursor: pointer; touch-action: manipulation;
}
.zone .slot { flex: 1; display: flex; align-items: center; justify-content: center; }
.zone .dot { display: block; width: 5.5rem; height: 5.5rem; border-radius: 50%; background: var(--accent); visibility: hidden; }
.zone[data-on="1"] .dot { visibility: visible; }
.zone[data-hit="1"] { border-color: var(--accent); }
.bigword { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.5rem, 12vw, 4.5rem); line-height: 1.1; overflow-wrap: anywhere; }
.bigdigit { font-family: var(--font-display); font-weight: 700; font-size: min(36vw, 10rem); line-height: 1; font-variant-numeric: tabular-nums; }
.display { display: flex; flex-wrap: wrap; justify-content: center; }
.box { width: 3.25rem; height: 4rem; margin: .3rem; border-bottom: 4px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 2.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.box.filled { border-color: var(--accent); }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); grid-gap: .75rem; gap: .75rem; max-width: 22rem; width: 100%; margin-left: auto; margin-right: auto; }
.pad .btn { min-height: 4.25rem; font-size: 1.6rem; padding: .25rem; }
.pad .btn.small { font-size: 1.05rem; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

  }
  function fmtShort(ymd) {
    var a = String(ymd || '').split('-');
    if (a.length !== 3 || !MONTHS[parseInt(a[1], 10) - 1]) return '';

  }
  function fmtTime(hm) {
    var a = String(hm || '').split(':'), h = parseInt(a[0], 10);
    if (isNaN(h) || a.length < 2) return '';

  function randCode(prefix, n) {

  function bySession(a, b) { return a.started_iso < b.started_iso ? -1 : (a.started_iso > b.started_iso ? 1 : 0); }

  /* ================= saved data (profiles and every play) ================= */
  function emptyDb() { return { app: 'recall-and-react', version: 2, profiles: [] }; }

  function cleanSession(s) {
    if (!s || typeof s !== 'object') return null;
    var o = {};
    FIELDS.forEach(function (f) {
      var v = s[f.k];
      if (f.t === 'n') o[f.k] = isNum(v) ? v : '';
      else o[f.k] = typeof v === 'string' ? v.slice(0, 3000) : (isNum(v) ? String(v) : '');
    });
    if (!o.id || !o.started_iso || isNaN(Date.parse(o.started_iso)) || !LEVELS[o.level]) return null;
    if (!TAG_SHORT[o.session_tag]) o.session_tag = 'normal';
    return o;
  }
  function cleanProfile(p) {
    if (!p || typeof p !== 'object') return null;
    var by = p.birth_year;
    var nick = typeof p.nickname === 'string' ? p.nickname.replace(/\s+/g, ' ').trim().slice(0, 24) : '';
    if (!nick || typeof p.id !== 'string' || !p.id || p.id.length > 60) return null;
    if (!isNum(by) || by < 1900 || by > 2100) return null;
    var edu = typeof p.education === 'string' && EDU.some(function (e) { return e[0] === p.education; }) ? p.education : '';
    var list = Array.isArray(p.sessions) ? p.sessions.slice(0, 3000) : [];
    var sessions = list.map(cleanSession).filter(function (x) { return x; }).sort(bySession);
    return {
      id: p.id, code: typeof p.code === 'string' && p.code ? p.code.slice(0, 12) : randCode('P-', 4),
      nickname: nick, birth_year: Math.round(by), education: edu,
      created_iso: typeof p.created_iso === 'string' ? p.created_iso.slice(0, 40) : '', sessions: sessions
    };
  }
  function sanitizeDb(d) {
    if (!d || typeof d !== 'object' || !Array.isArray(d.profiles) || d.profiles.length > 60) return null;
    var out = emptyDb();
    d.profiles.forEach(function (p) { var c = cleanProfile(p); if (c) out.profiles.push(c); });
    return out;
  }
  function loadDb() {
    try {
      localStorage.setItem('rr-test', '1'); localStorage.removeItem('rr-test');
    } catch (e) { memoryOnly = true; return emptyDb(); }
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) { var c = sanitizeDb(JSON.parse(raw)); if (c) return c; }
    } catch (e) {}
    return emptyDb();
  }
  var db = loadDb();
  function saveDb() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); return true; }
    catch (e) { memoryOnly = true; return false; }
  }
  function cur() {
    for (var i = 0; i < db.profiles.length; i++) if (db.profiles[i].id === curId) return db.profiles[i];
    return null;
  }
  function codeTaken(code, exceptId) {
    return db.profiles.some(function (p) { return p.code === code && p.id !== exceptId; });
  }
  function mergeImport(data) {
    var clean = sanitizeDb(data);
    if (!clean) return null;
    var addedP = 0, addedS = 0;
    clean.profiles.forEach(function (p) {
      var ex = null;
      db.profiles.forEach(function (x) { if (x.id === p.id) ex = x; });
      if (!ex) {
        while (codeTaken(p.code, p.id)) p.code = randCode('P-', 4);
        p.sessions.forEach(function (s) { s.profile_code = p.code; });
        db.profiles.push(p); addedP++; addedS += p.sessions.length;
      } else {
        var have = {};
        ex.sessions.forEach(function (s) { have[s.id] = 1; });
        p.sessions.forEach(function (s) { if (!have[s.id]) { s.profile_code = ex.code; ex.sessions.push(s); addedS++; } });
        ex.sessions.sort(bySession);
      }
    });
    return { profiles: addedP, sessions: addedS };
  }
  function levelList(p, level) { return p.sessions.filter(function (s) { return s.level === level; }); }
  function topLevel(p) {
    var best = 'standard', n = -1;
    ['standard', 'easy', 'challenge'].forEach(function (l) { var c = levelList(p, l).length; if (c > n) { n = c; best = l; } });
    return best;
  }

  /* ================= usual range (compare a person with themselves) ================= */
  function baseOf(list, m) {
    if (list.length < 3) return null;
    var vals = [];
    for (var j = 0; j < 3; j++) { var v = list[j][m.key]; if (isNum(v)) vals.push(v); }
    if (vals.length < 3) return null;
    var mu = mean(vals), s = sd(vals) || 0;
    var floor = m.floorPct ? m.floorPct * mu : m.floorAbs;
    return { mean: mu, sd: Math.max(s, floor) };
  }
  function statusFor(list, i) {
    if (i < 3) return { state: 'building', n: i + 1, notes: [] };
    var notes = [];
    METRICS.forEach(function (m) {
      var b = baseOf(list, m), v = list[i][m.key];
      if (!b || !isNum(v)) return;
      var z = (v - b.mean) / b.sd;
      if (Math.abs(z) > 2) notes.push(m.short + ': ' + (z > 0 ? m.pos : m.neg));
    });
    return { state: notes.length ? 'outside' : 'usual', n: 3, notes: notes };
  }
  function statusPill(st) {
    if (st.state === 'building') return '<span class="pill">Building your baseline (' + st.n + ' of 3)</span>';
    if (st.state === 'outside') return '<span class="pill warn">Outside your usual range</span>';
    return '<span class="pill">Within your usual range</span>';
  }

  /* ================= screen plumbing ================= */
  function render(html) {
    stage.onpointerdown = null;

    try { stage.focus({ preventScroll: true }); } catch (e) {}
  }
  function setProgress(i, total) {
    var steps = $('#steps');
    if (i == null) { steps.hidden = true; return; }
    steps.hidden = false;
    $('#stepbar').innerHTML = STEP_NAMES.map(function (_, k) { return '<i class="' + (k <= i ? 'on' : '') + '"></i>'; }).join('');
    $('#steplabel').textContent = 'Activity ' + (i + 1) + ' of ' + STEP_NAMES.length + ': ' + STEP_NAMES[i];
  }
  var STEP_NAMES = ['Words', 'Quick taps', 'Left or right', 'Numbers', 'Word check'];
  var ctxArmed = false, ctxTimer = null;
  function setChrome(mode) {
    var playing = mode === 'play';

  /* ================= saving files ================= */
  function shareBlock() {
    return '<h3>Share with the study</h3><div class="stack">' +

      '<ol class="muted" style="margin:0;padding-left:1.3rem"><li>Press “Copy my results”.</li><li>Press “Open the form”. Press and hold in the box and choose Paste.</li><li>Tick the box and press Submit.</li></ol>' +
      '<div class="btns">' + btn('sv-share', 'Copy my results', 'primary') +

  }
  function saveBlock(scope) {
    return '<div class="stack">' +
      '<div class="btns">' +
        btn('sv-backup', 'Save backup file') + btn('sv-csv', 'Save results table (CSV)') +
        (scope === 'all' ? '<label class="btn" for="fileIn">Load backup file</label><input id="fileIn" class="sr-only" type="file" accept=".json,application/json">' : '') +
      '</div>' +

      '</div></details></div>';
  }
  function setMsg(t) { var m = $('#savemsg'); if (m) m.textContent = t; }
  async function doSave(filename, text) {
    lastText = text;
    var ta = $('#csvtext'); if (ta) ta.value = text;
    if (!text) { setMsg('There is nothing to save yet. Play at least once first.'); return; }
    setMsg('');
    if (window.claude && window.claude.use) {
      var dl = null;
      try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
      if (dl) {
        try { await dl.save({ filename: filename, data: text }); setMsg('Saved. Look in your Downloads folder.'); return; }
        catch (e) {
          if (e && e.code === 'declined') { setMsg('Not saved. Press the button again when you are ready.'); return; }
        }
      }
      setMsg('The file could not be saved here. Open “Trouble saving?” below and copy the text instead.');
      return;
    }
    try {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: filename.slice(-5) === '.json' ? 'application/json' : 'text/csv' }));
      a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setMsg('File saved. Look in your Downloads folder. If nothing arrived, open “Trouble saving?” below.');
    } catch (e) { setMsg('The file could not be saved. Open “Trouble saving?” below and copy the text instead.'); }
  }
  function toCsv(rows) {
    if (!rows.length) return '';

    function cell(v) {
      if (v == null) return '';
      var s = String(v);
      if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s)) s = "'" + s;
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    return [cols.join(',')].concat(rows.map(function (r) { return cols.map(function (c) { return cell(r[c]); }).join(','); })).join('\r\n') + '\r\n';
  }
  function allRows(p) {
    var rows = [];
    (p ? [p] : db.profiles).forEach(function (x) { x.sessions.forEach(function (s) { rows.push(s); }); });

  }
  function bindSave(p) {
    on('sv-backup', function () {

      doSave('recall_and_react_backup_' + (p ? p.code + '_' : '') + todayStamp() + '.json', db.profiles.length ? JSON.stringify(obj, null, 1) : '');
    });

      };
      r.onerror = function () { setMsg('That file could not be read.'); };
      r.readAsText(f);
    };
  }

  function niceTicks(lo, hi, count, integer) {
    var span = hi - lo || 1, raw = span / count, mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), norm = raw / mag;
    var step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
    if (integer && step < 1) step = 1;
    var t = Math.floor(lo / step) * step, ticks = [];
    for (;;) { ticks.push(Math.round(t * 1000) / 1000); if (t >= hi - 1e-9) break; t += step; }
    return ticks;
  }
  function chartHtml(list, m) {
    var pts = [];
    list.forEach(function (s, i) { if (isNum(s[m.key])) pts.push({ i: i, v: s[m.key] }); });
    if (!pts.length) return '';
    var base = baseOf(list, m), n = list.length, W = 420, H = 250, L = 54, R = 16, T = 28, B = 44;
    var vals = pts.map(function (q) { return q.v; }), lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (base) { lo = Math.min(lo, base.mean - 2 * base.sd); hi = Math.max(hi, base.mean + 2 * base.sd); }
    if (m.kind === 'int') { lo = Math.floor(lo); hi = Math.ceil(hi); }
    if (hi === lo) hi = lo + (m.kind === 'int' ? 1 : 10);
    var ticks = niceTicks(lo, hi, 4, m.kind === 'int'), y0 = ticks[0], y1 = ticks[ticks.length - 1];
    function X(i) { return n === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (n - 1); }
    function Y(v) { return T + (H - T - B) * (1 - (v - y0) / (y1 - y0)); }
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(m.short + ' chart. ' + pts.length + (pts.length === 1 ? ' play' : ' plays') + '. First ' + metricText(m, pts[0].v) + ', latest ' + metricText(m, pts[pts.length - 1].v) + '.') + '">';
    if (base) {
      var top = Math.min(y1, base.mean + 2 * base.sd), bot = Math.max(y0, base.mean - 2 * base.sd);
      s += '<rect class="band" x="' + L + '" y="' + Y(top).toFixed(1) + '" width="' + (W - L - R) + '" height="' + Math.max(2, Y(bot) - Y(top)).toFixed(1) + '"/>';
    }
    ticks.forEach(function (t) {
      s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(t).toFixed(1) + '" y2="' + Y(t).toFixed(1) + '"/>' +
        '<text class="axis" x="' + (L - 8) + '" y="' + (Y(t) + 5).toFixed(1) + '" text-anchor="end">' + t + '</text>';
    });
    var seg = [], curSeg = [];
    pts.forEach(function (q, k) {
      if (k > 0 && q.i !== pts[k - 1].i + 1) { seg.push(curSeg); curSeg = []; }
      curSeg.push(X(q.i).toFixed(1) + ',' + Y(q.v).toFixed(1));
    });
    seg.push(curSeg);
    seg.forEach(function (c) { if (c.length > 1) s += '<polyline class="ln" points="' + c.join(' ') + '"/>'; });
    pts.forEach(function (q, k) {
      var last = k === pts.length - 1;
      s += '<circle class="pt' + (last ? ' last' : '') + '" cx="' + X(q.i).toFixed(1) + '" cy="' + Y(q.v).toFixed(1) + '" r="' + (last ? 7 : 5) + '"/>';
    });
    var lp = pts[pts.length - 1], ly = Y(lp.v), lx = X(lp.i), anchor = lx > W - 40 ? 'end' : 'middle';
    s += '<text class="val" x="' + (anchor === 'end' ? W - R : lx).toFixed(1) + '" y="' + (ly < T + 18 ? ly + 28 : ly - 14).toFixed(1) + '" text-anchor="' + anchor + '">' + (m.kind === 'ms' ? Math.round(lp.v) : Math.round(lp.v)) + '</text>';
    s += '<text class="axis" x="' + (n === 1 ? X(0) : L) + '" y="' + (H - 12) + '" text-anchor="' + (n === 1 ? 'middle' : 'start') + '">' + esc(fmtShort(list[0].local_date)) + '</text>';
    if (n > 1) s += '<text class="axis" x="' + (W - R) + '" y="' + (H - 12) + '" text-anchor="end">' + esc(fmtShort(list[n - 1].local_date)) + '</text>';
    return s + '</svg>';
  }

  /* ================= the game: choosing words ================= */
  function chooseWords(p, n) {
    var recent = {};
    p.sessions.slice(-3).forEach(function (x) {
      String(x.words_studied || '').split(';').concat(String(x.words_foils || '').split(';')).forEach(function (w) { if (w) recent[w] = 1; });
    });
    var pool = WORDS.filter(function (w) { return !recent[w]; });
    if (pool.length < 2 * n) pool = WORDS.slice();
    var pick = shuffle(pool).slice(0, 2 * n);
    return { studied: pick.slice(0, n), foils: pick.slice(n) };
  }

  /* activity 1: word study */
  async function wordStudy(ctx, cfg, words) {
    setProgress(0);
    await infoScreen('Remember some words',
      ['You will see ' + words.length + ' words, one at a time.',

             '<div class="arena"><div class="bigword">' + esc(words[i]) + '</div><p class="muted">Say it out loud.</p></div>');

  /* activity 2: simple reaction */
  function simpleTrial(ctx, label, q) {
    return new Promise(function (resolve, reject) {
      render('<p class="muted">' + label + '</p><div class="arena">' +
             '<div class="target" id="tg" data-state="wait">Wait</div>' +
             '<p class="muted" id="hint">Tap only when the circle turns green.</p></div>');
      var tg = $('#tg'), hint = $('#hint'), state = 'wait', t0 = 0, goT, missT;
      function dead() {
        if (ctx.id !== runId) { clearTimeout(goT); clearTimeout(missT); reject(ABORT); return true; }
        return false;
      }
      function end(v) { clearTimeout(goT); clearTimeout(missT); stage.onpointerdown = null; keyHandler = null; resolve(v); }
      function hit() {
        if (state === 'wait') {
          state = 'early'; clearTimeout(goT);
          tg.dataset.state = 'early'; tg.textContent = 'Too soon';
          hint.textContent = 'Please wait for green, then tap.';
          setTimeout(function () { if (!dead()) end({ type: 'early' }); }, 1400);
        } else if (state === 'go') {
          var rt = performance.now() - t0;
          state = 'done'; clearTimeout(missT);
          tg.dataset.state = 'done'; tg.textContent = 'Got it';
          setTimeout(function () { if (!dead()) end({ type: 'ok', rt: rt }); }, 800);
        }
      }
      stage.onpointerdown = function (e) { e.preventDefault(); hit(); };
      keyHandler = function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); hit(); } };
      goT = setTimeout(function () {
        if (dead()) return;
        state = 'go'; tg.dataset.state = 'go'; tg.textContent = 'TAP NOW'; hint.textContent = '';
        t0 = performance.now();
        requestAnimationFrame(function () { if (state === 'go') t0 = performance.now(); });
        missT = setTimeout(function () {
          if (dead()) return;
          state = 'done'; tg.dataset.state = 'early'; tg.textContent = 'Missed';
          setTimeout(function () { if (!dead()) end({ type: 'missed' }); }, 900);
        }, q.missMs);
      }, randInt(q.minWait, q.maxWait));
    });
  }
  async function simpleBlock(ctx, n, practice, q) {
    var out = { rts: [], falseStarts: 0, missed: 0, skipped: 0 };
    for (var t = 1; t <= n; t++) {
      var label = (practice ? 'Practice ' : 'Tap ') + t + ' of ' + n, starts = 0;
      for (;;) {
        var r = await simpleTrial(ctx, label, q);
        if (r.type === 'ok') { out.rts.push(r.rt); break; }
        if (r.type === 'missed') { out.missed++; break; }
        out.falseStarts++; starts++;
        if (starts >= 3) { out.skipped++; break; }
      }
    }
    return out;
  }
  async function simpleTask(ctx, cfg) {
    setProgress(1);

       'Please do not tap before it turns green. First there are 2 practice taps.'], 'Try the practice');
    await simpleBlock(ctx, 2, true, cfg.simple);

    return simpleBlock(ctx, cfg.simple.n, false, cfg.simple);
  }

  /* activity 3: choice reaction */
  function choiceTrial(ctx, label, q) {
    return new Promise(function (resolve, reject) {
      render('<p class="muted">' + label + '</p><div class="arena">' +
             '<div class="zones">' +
               '<button class="zone" id="zl" type="button"><span class="slot"><span class="dot"></span></span><span>LEFT</span></button>' +
               '<button class="zone" id="zr" type="button"><span class="slot"><span class="dot"></span></span><span>RIGHT</span></button>' +
             '</div><p class="muted">Tap the side where the dot appears.</p></div>');
      var zl = $('#zl'), zr = $('#zr'), side = Math.random() < 0.5 ? 'left' : 'right';
      var shown = false, done = false, t0 = 0, showT, missT;
      function dead() {
        if (ctx.id !== runId) { clearTimeout(showT); clearTimeout(missT); reject(ABORT); return true; }
        return false;
      }
      function end(v) { clearTimeout(showT); clearTimeout(missT); keyHandler = null; resolve(v); }
      function tap(which) {
        if (done || !shown) return;

        setTimeout(function () { if (!dead()) end({ type: 'resp', rt: rt, correct: which === side }); }, 350);
      }
      zl.onpointerdown = function (e) { e.preventDefault(); tap('left'); };
      zr.onpointerdown = function (e) { e.preventDefault(); tap('right'); };
      keyHandler = function (e) {
        if (e.key === 'ArrowLeft') { e.preventDefault(); tap('left'); }
        if (e.key === 'ArrowRight') { e.preventDefault(); tap('right'); }
      };
      showT = setTimeout(function () {
        if (dead()) return;
        (side === 'left' ? zl : zr).dataset.on = '1';
        shown = true; t0 = performance.now();
        requestAnimationFrame(function () { if (!done) t0 = performance.now(); });
        missT = setTimeout(function () {
          if (dead()) return;
          done = true; end({ type: 'missed' });
        }, q.missMs);
      }, randInt(q.minWait, q.maxWait));
    });
  }
  async function choiceBlock(ctx, n, practice, q) {
    var out = { rts: [], errors: 0, missed: 0 };
    for (var t = 1; t <= n; t++) {
      var r = await choiceTrial(ctx, (practice ? 'Practice ' : 'Dot ') + t + ' of ' + n, q);
      if (r.type === 'missed') out.missed++;
      else if (r.correct) out.rts.push(r.rt);
      else out.errors++;
    }
    return out;
  }
  async function choiceTask(ctx, cfg) {
    setProgress(2);
    await infoScreen('Left or right',
      ['Two large boxes will appear, LEFT and RIGHT. After a short wait, a dot appears in one of them. Tap that box as quickly as you can.',
       'First there are 2 practice rounds.'], 'Try the practice');
    await choiceBlock(ctx, 2, true, cfg.choice);
    await infoScreen('Practice finished', ['Now there are ' + cfg.choice.n + ' rounds that count.'], 'Begin');
    return choiceBlock(ctx, cfg.choice.n, false, cfg.choice);
  }

  /* activity 4: number lists */
  function makeDigits(len) {
    var d = [];
    while (d.length < len) { var x = randInt(0, 9); if (d.length && d[d.length - 1] === x) continue; d.push(x); }
    return d;
  }
  async function showDigits(ctx, seq, dg) {
    render('<p class="muted">Watch the numbers</p><div class="arena"><div class="bigdigit" id="bd">&nbsp;</div></div>');
    await wait(ctx, 1200);
    for (var i = 0; i < seq.length; i++) {
      $('#bd').textContent = seq[i];
      await wait(ctx, dg.showMs);
      $('#bd').innerHTML = '&nbsp;';
      await wait(ctx, dg.gapMs);
    }
  }
  function enterDigits(len) {
    return new Promise(function (res) {
      var val = '';
      var keys = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (d) { return '<button class="btn" type="button" data-d="' + d + '">' + d + '</button>'; }).join('') +
        '<button class="btn small" type="button" id="bk">Back</button>' +
        '<button class="btn" type="button" data-d="0">0</button>' +
        '<button class="btn primary small" type="button" id="dn" disabled>Done</button>';
      render('<p>Tap the numbers in the same order.</p><div class="display" id="disp"></div><div class="pad" id="pad">' + keys + '</div>');
      function draw() {
        var h = '';
        for (var i = 0; i < len; i++) h += '<span class="box' + (i < val.length ? ' filled' : '') + '">' + (i < val.length ? val.charAt(i) : '') + '</span>';
        $('#disp').innerHTML = h;
        $('#dn').disabled = val.length !== len;
      }
      function add(d) { if (val.length < len) { val += d; draw(); } }
      function back() { val = val.slice(0, -1); draw(); }
      function submit() { if (val.length === len) res(val); }
      $$('[data-d]').forEach(function (b) { b.onclick = function () { add(b.getAttribute('data-d')); }; });
      $('#bk').onclick = back;
      $('#dn').onclick = submit;
      keyHandler = function (e) {
        if (/^[0-9]$/.test(e.key)) add(e.key);
        else if (e.key === 'Backspace') back();
        else if (e.key === 'Enter') submit();
      };
      draw();
    });
  }
  async function digitTask(ctx, cfg) {
    var dg = cfg.digit;
    setProgress(3);
    await infoScreen('Remember numbers',
      ['You will see a list of numbers, one at a time. Afterwards, tap the same numbers in the same order.',
       'The lists get a little longer each time. Everyone reaches a point where it becomes hard, and that is normal.'], 'Try one practice');
    await showDigits(ctx, makeDigits(2), dg);
    await enterDigits(2);
    await infoScreen('Practice finished', ['The real lists start now.'], 'Begin');
    var len = dg.start, best = 0, log = [];
    while (len <= dg.max) {
      var ok = 0;
      for (var k = 0; k < 2; k++) {
        var seq = makeDigits(len);
        await showDigits(ctx, seq, dg);
        var ans = await enterDigits(len);
        var good = ans === seq.join('');
        log.push(len + ':' + (good ? 1 : 0));
        if (good) ok++;
      }
      if (ok === 0) break;
      best = len; len++;
    }
    return { max: best, log: log };
  }

  /* activity 5: word check */
  async function recogTask(ctx, cfg, w) {
    setProgress(4);
    var n = w.studied.length;
    await infoScreen('Which words did you see?',
      ['At the start you saw ' + n + ' words. Now you will see ' + (2 * n) + ' words, one at a time. Some you saw earlier and some are new.',
       'Tap Yes if you saw the word earlier. Tap No if it is new. A guess is fine.'], 'Begin');
    var items = shuffle(w.studied.map(function (x) { return { w: x, seen: true }; })
                        .concat(w.foils.map(function (x) { return { w: x, seen: false }; })));
    var out = { hits: 0, fa: 0, rts: [], resp: [] };
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var a = await new Promise(function (res) {
        render('<p class="muted">Word ' + (i + 1) + ' of ' + items.length + '</p>' +
               '<div class="arena"><p>Did you see this word earlier?</p><div class="bigword">' + esc(it.w) + '</div></div>' +
               '<div class="btns two">' + btn('y', 'Yes, I saw it', 'primary') + btn('n', 'No, it is new') + '</div>');
        var t0 = performance.now();
        $('#y').onclick = function () { res({ said: true, rt: performance.now() - t0 }); };
        $('#n').onclick = function () { res({ said: false, rt: performance.now() - t0 }); };
      });
      if (ctx.id !== runId) throw ABORT;
      if (it.seen && a.said) out.hits++;
      if (!it.seen && a.said) out.fa++;
      out.rts.push(a.rt);
      out.resp.push(it.w + ':' + (a.said ? 'yes' : 'no') + (it.seen ? ':old' : ':new'));
    }
    return out;
  }

  /* ================= one whole play ================= */
  function buildRecord(p, setup, startedAt, words, simple, choice, digits, recog) {
    var S = summ(simple.rts), C = summ(choice.rts), list = levelList(p, setup.level);
    return {
      id: randCode('S-', 8) + Date.now().toString(36), profile_code: p.code, started_iso: startedAt.toISOString(),
      local_date: startedAt.getFullYear() + '-' + pad2(startedAt.getMonth() + 1) + '-' + pad2(startedAt.getDate()),
      local_time: pad2(startedAt.getHours()) + ':' + pad2(startedAt.getMinutes()),
      weekday: DAYS[startedAt.getDay()], tz_offset_min: -startedAt.getTimezoneOffset(),
      session_number: p.sessions.length + 1, session_number_at_level: list.length + 1,
      age_at_play: startedAt.getFullYear() - p.birth_year, education: p.education, level: setup.level, session_tag: setup.tag,
      stress_rating: setup.stress, sleep_hours: setup.sleep,
      device: (window.matchMedia && matchMedia('(pointer: coarse)').matches) ? 'touch' : 'mouse_or_trackpad',
      window_width_px: window.innerWidth,
      simple_valid_trials: S.n, simple_median_ms: r0(S.median), simple_mean_ms: r0(S.mean), simple_sd_ms: r0(S.sd), simple_cv: r3(S.cv),
      simple_false_starts: simple.falseStarts, simple_missed: simple.missed, simple_skipped: simple.skipped,
      simple_slow_over_1s: simple.rts.filter(function (x) { return x > 1000; }).length,
      simple_rts_ms: simple.rts.map(r0).join(';'),
      choice_valid_trials: C.n, choice_median_ms: r0(C.median), choice_mean_ms: r0(C.mean), choice_sd_ms: r0(C.sd), choice_cv: r3(C.cv),
      choice_errors: choice.errors, choice_missed: choice.missed, choice_rts_ms: choice.rts.map(r0).join(';'),
      digit_span_max: digits.max, digit_trials: digits.log.join(';'),
      words_per_list: words.studied.length, words_studied: words.studied.join(';'), words_foils: words.foils.join(';'),
      words_hits: recog.hits, words_false_alarms: recog.fa, words_score: recog.hits - recog.fa,
      words_recog_median_ms: r0(median(recog.rts)), words_responses: recog.resp.join(';'),
      session_minutes: Math.round((Date.now() - startedAt.getTime()) / 600) / 100
    };
  }
  async function playSession(p, setup) {
    var ctx = { id: ++runId }, cfg = LEVELS[setup.level], startedAt = new Date();
    setChrome('play');
    try {
      var words = chooseWords(p, cfg.words);
      await wordStudy(ctx, cfg, words.studied);
      var simple = await simpleTask(ctx, cfg);
      var choice = await choiceTask(ctx, cfg);
      var digits = await digitTask(ctx, cfg);
      var recog = await recogTask(ctx, cfg, words);
      var rec = buildRecord(p, setup, startedAt, words, simple, choice, digits, recog);
      p.sessions.push(rec); p.sessions.sort(bySession);
      var saved = saveDb();
      viewResult(p, rec, saved);
    } catch (e) {
      if (e !== ABORT) {
        setChrome('browse');
        render('<h2>Something went wrong</h2><p>Please refresh the page and try again. Your earlier results are safe.</p>' + '<div class="btns">' + btn('home', 'Back to start', 'primary') + '</div>');
        on('home', function () { viewWho(); });
        try { console.error(e); } catch (x) {}
      }
    }
  }

  /* ================= header buttons ================= */
  var sizeBtn = $('#size'), large = false;
  try { large = localStorage.getItem('recall-react-large') === '1'; } catch (e) {}
  function applySize() {
    document.documentElement.classList.toggle('large', large);
    sizeBtn.textContent = large ? 'Normal text' : 'Larger text';
    sizeBtn.setAttribute('aria-pressed', String(large));
  }
  applySize();
  sizeBtn.onclick = function () {
    large = !large; applySize();
    try { localStorage.setItem('recall-react-large', large ? '1' : '0'); } catch (e) {}
  };
  $('#aboutBtn').onclick = viewAbout;
  $('#ctx').onclick = function () {
    var c = $('#ctx');
    if (!ctxArmed) {
      ctxArmed = true; c.textContent = 'Tap again to stop';
      ctxTimer = setTimeout(function () { ctxArmed = false; c.textContent = 'Stop this game'; }, 4000);
      return;
    }
    runId++;
    viewHome();
  };

  if ('serviceWorker' in navigator && !window.claude && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
    });
  }

  viewWho();
})();

</script></body></html>
